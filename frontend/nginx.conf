server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Subidas de hasta 50 MB (MAX_FILE_SIZE_MB del backend) + margen multipart.
    client_max_body_size 60m;

    # Módulos ES (.mjs): el pdf.worker de pdf.js va en assets/pdfjs/*.mjs y el
    # navegador lo rechaza como módulo si no llega con MIME JavaScript. La tabla
    # mime.types de nginx no trae la extensión y la servía como octet-stream
    # (visto en QA el 2026-09-08: "Setting up fake worker").
    location ~* \.mjs$ {
        types { text/javascript mjs; }
        default_type text/javascript;
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida vuelve a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API en el mismo origen -> el backend del compose. Sin CORS.
    location /api {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Subidas grandes y descargas de resultados: no cortar a los 60s por defecto.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
}
