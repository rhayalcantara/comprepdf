# docker-compose.yml — PRODUCCIÓN (192.168.113.20) y qa del catálogo del Puente.
#
# Lo despliega el Puente con una secuencia fija y sin opciones:
#   git checkout main -> docker compose config -q -> docker compose build -> docker compose up -d
# Por eso este archivo ES el de producción: sin bind mounts, un único puerto
# publicado (el del frontend), volúmenes nombrados. El de desarrollo es
# docker-compose.dev.yml. NUNCA versionar un docker-compose.override.yml: en
# producción se aplicaría solo.
#
# Configuración SOLO por `.env` en este directorio (permisos 600). No repetir
# aquí en `environment:` claves que estén en .env: lo de `environment:` GANA y
# anula el .env sin avisar. Plantilla: .env.example.
#
# Un solo puerto hacia fuera: nginx (frontend) sirve la SPA y proxea /api al
# backend por la red interna. MySQL y Redis no se publican al host.

name: comprepdf

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file: .env
    # MYSQL_ROOT_PASSWORD / MYSQL_DATABASE / MYSQL_USER / MYSQL_PASSWORD vienen del .env
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      # Solo en el PRIMER arranque (volumen vacío): esquema completo. Las
      # migraciones posteriores las aplica el backend al arrancar
      # (backend/src/services/migration.service.ts) y las registra en
      # schema_migrations.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - comprepdf

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - comprepdf

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    # Salud: GET http://<host>:${COMPREPDF_PORT}/api/v1/health (vía nginx)
    # uploads/outputs los comparten backend (usuario node, uid 1000) y worker
    # (usuario worker, uid 1000): mismo uid en ambas imágenes a propósito.
    volumes:
      - uploads_data:/app/uploads
      - outputs_data:/app/outputs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - comprepdf

  worker:
    build:
      context: ./python-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - uploads_data:/app/uploads
      - outputs_data:/app/outputs
      - ca_store:/app/ca-store
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_healthy   # el backend migra el esquema antes de abrir el puerto
    networks:
      - comprepdf

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${COMPREPDF_PORT:-3060}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - comprepdf

volumes:
  mysql_data:
  redis_data:
  uploads_data:
  outputs_data:
  ca_store:

networks:
  comprepdf:
