version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: comprepdf-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-comprepdf}
      MYSQL_USER: ${MYSQL_USER:-comprepdf}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-comprepdf123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - comprepdf-network

  redis:
    image: redis:7-alpine
    container_name: comprepdf-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - comprepdf-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: comprepdf-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-comprepdf}
      MYSQL_USER: ${MYSQL_USER:-comprepdf}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-comprepdf123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
      - outputs_data:/app/outputs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - comprepdf-network

  python-worker:
    build:
      context: ./python-worker
      dockerfile: Dockerfile
    container_name: comprepdf-python-worker
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-comprepdf}
      MYSQL_USER: ${MYSQL_USER:-comprepdf}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-comprepdf123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      UPLOAD_DIR: /app/uploads
      OUTPUT_DIR: /app/outputs
    volumes:
      - ./python-worker:/app
      - uploads_data:/app/uploads
      - outputs_data:/app/outputs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - comprepdf-network
    command: celery -A app.workers.compression_worker worker --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: comprepdf-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - comprepdf-network

volumes:
  mysql_data:
  redis_data:
  uploads_data:
  outputs_data:

networks:
  comprepdf-network:
    driver: bridge
